name: Build Region Console

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4.2.2

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Восстановление пакетов NuGet
        run: dotnet restore RegionConsole.sln

      - name: Сборка решения (Release, .NET Framework 4.7.2) через MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\msbuild.exe
          if (-not $msbuild) {
            Write-Error "MSBuild не найден через vswhere"
            exit 1
          }
          Write-Host "Используется MSBuild: $msbuild"
          & $msbuild RegionConsole.sln /p:Configuration=Release /p:Platform="Any CPU" /v:detailed /nologo

      - name: Запуск автотестов
        run: dotnet test RegionConsole.sln -c Release --no-build --nologo

      - name: Публикация артефакта .exe
        uses: actions/upload-artifact@v4
        with:
          name: RegionConsole.exe
          path: RegionConsole/bin/Release/RegionConsole.exe
          if-no-files-found: error

      - name: Упаковка архива исходного кода
        shell: pwsh
        run: Compress-Archive -Path * -DestinationPath RegionConsole-source.zip -Exclude @(".git", "bin", "obj", ".vs", "*.zip") -Force

      - name: Публикация архива исходного кода
        uses: actions/upload-artifact@v4
        with:
          name: RegionConsole-source
          path: RegionConsole-source.zip
