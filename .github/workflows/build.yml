name: Build Region Console

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4.2.2

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Восстановление пакетов NuGet
        run: dotnet restore RegionConsole.sln

      - name: Публикация основного проекта (Release, .NET Framework 4.7.2)
        shell: pwsh
        continue-on-error: true
        run: dotnet publish RegionConsole/RegionConsole.csproj -c Release --nologo -v:detailed -o "${{ github.workspace }}/publish" 2>&1 | Tee-Object -FilePath build-main.log

      - name: Загрузка лога сборки основного проекта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-main-log
          path: build-main.log
          if-no-files-found: ignore

      - name: Сборка тестового проекта (Release, .NET Framework 4.7.2)
        shell: pwsh
        continue-on-error: true
        run: dotnet build RegionConsole.Tests/RegionConsole.Tests.csproj -c Release --nologo -v:detailed 2>&1 | Tee-Object -FilePath build-tests.log

      - name: Загрузка лога сборки тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-tests-log
          path: build-tests.log
          if-no-files-found: ignore

      - name: Запуск автотестов
        run: dotnet test RegionConsole.sln -c Release --no-build --nologo

      - name: Найти и подготовить .exe для артефакта
        shell: pwsh
        run: |
          Write-Host "=== Содержимое publish/ ==="
          Get-ChildItem -Path "publish" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          $exe = Get-ChildItem -Path "publish" -Filter "RegionConsole.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error "RegionConsole.exe не найден в publish/"
            Write-Host "=== Поиск по всему репозиторию ==="
            Get-ChildItem -Path "." -Filter "RegionConsole.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Найден .exe: $($exe.FullName)"
          Copy-Item $exe.FullName -Destination "RegionConsole.exe" -Force

      - name: Публикация артефакта .exe
        uses: actions/upload-artifact@v4
        with:
          name: RegionConsole.exe
          path: RegionConsole.exe
          if-no-files-found: error

      - name: Упаковка архива исходного кода
        shell: pwsh
        run: Compress-Archive -Path * -DestinationPath RegionConsole-source.zip -Exclude @(".git", "bin", "obj", ".vs", "*.zip") -Force

      - name: Публикация архива исходного кода
        uses: actions/upload-artifact@v4
        with:
          name: RegionConsole-source
          path: RegionConsole-source.zip
