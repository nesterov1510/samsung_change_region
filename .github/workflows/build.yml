name: Build Region Console

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4.2.2

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Восстановление пакетов NuGet
        run: dotnet restore RegionConsole.sln

      - name: Сборка основного проекта (Release, .NET Framework 4.8)
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet msbuild RegionConsole/RegionConsole.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:OutDir="${{ github.workspace }}/bin/out" /v:detailed /nologo 2>&1 | Tee-Object -FilePath build-main.log
          Write-Host "=== bin/out содержимое ==="
          Get-ChildItem -Path "${{ github.workspace }}/bin/out" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Загрузка лога сборки основного проекта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-main-log
          path: build-main.log
          if-no-files-found: ignore

      - name: Сборка тестового проекта (Release, .NET Framework 4.8) через MSBuild
        shell: pwsh
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\msbuild.exe
          & $msbuild RegionConsole.Tests/RegionConsole.Tests.csproj /p:Configuration=Release /p:Platform="Any CPU" /v:detailed /nologo 2>&1 | Tee-Object -FilePath build-tests.log

      - name: Загрузка лога сборки тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-tests-log
          path: build-tests.log
          if-no-files-found: ignore

      - name: Запуск автотестов
        run: dotnet test RegionConsole.sln -c Release --no-build --nologo

      - name: Найти и подготовить .exe для артефакта
        shell: pwsh
        run: |
          $outDir = "${{ github.workspace }}/bin/out"
          Write-Host "=== bin/out содержимое ==="
          Get-ChildItem -Path "$outDir" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== Все .exe в репозитории ==="
          Get-ChildItem -Path "." -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
          $exe = Get-ChildItem -Path "$outDir" -Filter "RegionConsole.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path "." -Filter "RegionConsole.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Error "RegionConsole.exe не найден нигде"
            exit 1
          }
          Write-Host "Найден .exe: $($exe.FullName)"
          Copy-Item $exe.FullName -Destination "RegionConsole.exe" -Force

      - name: Публикация артефакта .exe
        uses: actions/upload-artifact@v4
        with:
          name: RegionConsole.exe
          path: RegionConsole.exe
          if-no-files-found: error

      - name: Упаковка архива исходного кода
        shell: pwsh
        run: Compress-Archive -Path * -DestinationPath RegionConsole-source.zip -Exclude @(".git", "bin", "obj", ".vs", "*.zip") -Force

      - name: Публикация архива исходного кода
        uses: actions/upload-artifact@v4
        with:
          name: RegionConsole-source
          path: RegionConsole-source.zip
